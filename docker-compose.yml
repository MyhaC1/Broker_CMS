# Локальный стек CMS: docker compose up -d --build  (db + cms)
# Только БД для разработки на хосте: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: broker_cms
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms -d broker_cms']
      interval: 5s
      timeout: 3s
      retries: 10

  cms:
    build: .
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgres://cms:cms@db:5432/broker_cms
      PAYLOAD_SECRET: dev-payload-secret-b7f3a1c94e2d48f6a0c5e8d217394b6f
      CMS_API_KEY: dev-cms-api-key
      # Вебхук уходит ИЗ контейнера на сайт, работающий на хосте (:3000)
      SITE_WEBHOOK_URL: http://host.docker.internal:3000/api/revalidate
      SITE_WEBHOOK_SECRET: local-dev-secret
      # Эти URL открываются в браузере редактора/посетителя — остаются localhost
      CMS_PUBLIC_URL: http://localhost:3001
      SITE_URL: http://localhost:3000
      SITE_PREVIEW_SECRET: preview-dev-secret
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - cms-media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  cms-media:
